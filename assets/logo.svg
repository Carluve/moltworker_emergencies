<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- Kanban board glyph -->
  <!-- Column 1: New (red) -->
  <rect x="252" y="300" width="150" height="424" rx="24" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="278" cy="332" r="10" fill="#ef4444"/>
  <rect x="268" y="360" width="118" height="64" rx="14" fill="#ef4444"/>
  <rect x="268" y="448" width="118" height="64" rx="14" fill="#ef4444" fill-opacity="0.55"/>
  <rect x="268" y="536" width="118" height="64" rx="14" fill="#ef4444" fill-opacity="0.3"/>

  <!-- Column 2: Triaged / In progress (amber) -->
  <rect x="437" y="300" width="150" height="424" rx="24" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="463" cy="332" r="10" fill="#fbbf24"/>
  <rect x="453" y="360" width="118" height="64" rx="14" fill="#fbbf24"/>
  <rect x="453" y="448" width="118" height="64" rx="14" fill="#fbbf24" fill-opacity="0.55"/>

  <!-- Column 3: Resolved (green) -->
  <rect x="622" y="300" width="150" height="424" rx="24" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="648" cy="332" r="10" fill="#4ade80"/>
  <rect x="638" y="360" width="118" height="64" rx="14" fill="#4ade80"/>

  <!-- Emergency alert badge -->
  <circle cx="772" cy="268" r="118" fill="#e94560"/>
  <circle cx="772" cy="268" r="118" fill="none" stroke="#1a1a2e" stroke-width="14"/>
  <rect x="750" y="206" width="44" height="96" rx="22" fill="#ffffff"/>
  <circle cx="772" cy="330" r="24" fill="#ffffff"/>
</svg>
